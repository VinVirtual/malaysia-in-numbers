name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MNUM_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install (playwright-core only, for the browser test)
        run: npm ci
      - name: Unit tests (recorded fixtures, no network)
        run: npm test
      - name: Committed data is valid
        run: node scripts/mnum.mjs check
      - name: Build the site (links, CSP and size budget checked)
        run: node scripts/mnum.mjs site
      - name: Browser test (strict CSP, charts, keyboard, 360 px, contrast, both themes)
        run: npm run test:e2e
