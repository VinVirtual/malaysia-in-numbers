# Run your own copy: once a day, ask api.data.gov.my for every dataset, commit what changed,
# build the site and publish it on GitHub Pages.
#
# This repository does not host a site, so the schedule below is off and nothing runs unless
# started by hand. In your fork: uncomment the two schedule lines, then set
# Settings > Pages > Source to "GitHub Actions".
#
# Optional repository variable MNUM_SITE_URL (e.g. https://data.example.org/) if you use a
# custom domain; otherwise the GitHub Pages address is used.
#
# Jobs and their rights:
#   fetch  - contents: read. Talks to the API with no write rights and no stored credentials;
#            hands the data folder on as an artifact and says whether anything changed.
#   commit - contents: write. Runs only when something changed. Takes only the dataset files
#            and the release log, validates them, rebases and pushes.
#   deploy - pages: write, id-token: write. Builds the site from the default branch and
#            publishes it, every day the fetch succeeded, so the edition date is today's and a
#            failed deploy is retried the next day.
#   alert  - no rights. Fails the run, after the rest has finished, if any dataset failed,
#            so a partial failure is a red run (and an email), not just a warning.
# Minutes: free on public repositories. A private fork uses about 4 billed minutes a day.
name: deploy-pages

on:
  # Uncomment the next two lines in your fork to update every day.
  # schedule:
  #   - cron: '23 1 * * *' # 01:23 UTC = 09:23 in Malaysia
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Only rebuild and deploy the site from the committed data'
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event.inputs.deploy_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
      failed: ${{ steps.fetch.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Fetch every dataset (one request each, 16 s apart)
        id: fetch
        run: node scripts/mnum.mjs fetch
      - name: Validate and build the site (fails on broken links, inline code or size budget)
        env:
          MNUM_SITE_URL: ${{ vars.MNUM_SITE_URL }}
        run: |
          node scripts/mnum.mjs check
          node scripts/mnum.mjs site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.fetch.outputs.changed == 'true'
        with:
          name: data
          path: |
            data/series/*.json
            data/releases.jsonl
          if-no-files-found: error
          retention-days: 7

  commit:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push data/series/*.json and data/releases.jsonl, nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: ${{ runner.temp }}/data
      - name: Take only the data files, validate them, commit and push
        run: |
          src="$RUNNER_TEMP/data"
          if [[ -L "$src" ]]; then echo "artifact is a symlink"; exit 1; fi
          for f in "$src"/series/*.json; do
            name="$(basename "$f")"
            if [[ ! "$name" =~ ^[a-z0-9_]+\.json$ || -L "$f" || ! -f "$f" ]]; then echo "unexpected file: $name"; exit 1; fi
            cp "$f" "data/series/$name"
          done
          if [[ -f "$src/releases.jsonl" && ! -L "$src/releases.jsonl" ]]; then
            # The log only grows: the committed log must be the start of the new one.
            if [[ -f data/releases.jsonl ]] && ! head -c "$(stat -c%s data/releases.jsonl)" "$src/releases.jsonl" | cmp -s - data/releases.jsonl; then echo "release log was rewritten, not appended"; exit 1; fi
            cp "$src/releases.jsonl" data/releases.jsonl
          fi
          node scripts/mnum.mjs check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series data/releases.jsonl
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data: update $(date -u +%Y-%m-%d)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          node scripts/mnum.mjs check
          git push origin "HEAD:$GITHUB_REF_NAME"

  deploy:
    needs: [fetch, commit]
    if: >-
      always() && github.ref_name == github.event.repository.default_branch &&
      ((needs.fetch.result == 'success' && needs.commit.result != 'failure') || github.event.inputs.deploy_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write # deploy-pages proves the artifact came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Validate and build the site from the committed data
        env:
          MNUM_SITE_URL: ${{ vars.MNUM_SITE_URL || format('{0}/', steps.pages.outputs.base_url) }}
        run: |
          node scripts/mnum.mjs check
          node scripts/mnum.mjs site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  alert:
    needs: [fetch, deploy]
    if: always() && needs.fetch.outputs.failed != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fail the run because some datasets failed
        env:
          FAILED: ${{ needs.fetch.outputs.failed }}
        run: |
          echo "::error title=Datasets failed::These datasets kept their previous figures: $FAILED. See the fetch job's log."
          exit 1
